<script>
// ==================== 默认顶点 ====================
const defaultVertices = [
  [0, 0], [0, 7.03], [2.21, 7.03], [2.21, 9.91], [4.32, 9.91],
  [4.32, 8.26], [5.91, 8.26], [5.91, 5.86], [2.85, 5.86], [2.85, 0]
];

let vertices = defaultVertices.map(v => [...v]);

// ==================== 顶点输入管理 ====================
function renderVertices() {
  const tbody = document.getElementById('vertexBody');
  tbody.innerHTML = '';
  vertices.forEach((v, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="width:28px;color:#999;font-size:12px;">${i + 1}</td>
      <td><input type="number" step="0.01" value="${v[0]}" onchange="updateVertex(${i},0,this.value)"></td>
      <td><input type="number" step="0.01" value="${v[1]}" onchange="updateVertex(${i},1,this.value)"></td>
      <td><button class="del-btn" onclick="removeVertex(${i})" title="删除">×</button></td>
    `;
    tbody.appendChild(tr);
  });
}

function updateVertex(i, axis, val) {
  vertices[i][axis] = parseFloat(val) || 0;
}

function addVertex() {
  vertices.push([0, 0]);
  renderVertices();
}

function removeVertex(i) {
  if (vertices.length <= 3) return;
  vertices.splice(i, 1);
  renderVertices();
}

// ==================== 核心计算（射线法） ====================
function hlineIntersections(poly, y) {
  const pts = [];
  const n = poly.length;
  for (let i = 0; i < n; i++) {
    const [x1, y1] = poly[i];
    const [x2, y2] = poly[(i + 1) % n];
    if ((y1 > y) !== (y2 > y)) {
      const t = (y - y1) / (y2 - y1);
      pts.push(x1 + t * (x2 - x1));
    }
  }
  pts.sort((a, b) => a - b);
  const segs = [];
  for (let j = 0; j < pts.length - 1; j += 2) {
    segs.push([pts[j], pts[j + 1]]);
  }
  return segs;
}

function vlineIntersections(poly, x) {
  const pts = [];
  const n = poly.length;
  for (let i = 0; i < n; i++) {
    const [x1, y1] = poly[i];
    const [x2, y2] = poly[(i + 1) % n];
    if ((x1 > x) !== (x2 > x)) {
      const t = (x - x1) / (x2 - x1);
      pts.push(y1 + t * (y2 - y1));
    }
  }
  pts.sort((a, b) => a - b);
  const segs = [];
  for (let j = 0; j < pts.length - 1; j += 2) {
    segs.push([pts[j], pts[j + 1]]);
  }
  return segs;
}

function calcDirection(poly, direction, cover, anchor, spacing) {
  const xs = poly.map(p => p[0]);
  const ys = poly.map(p => p[1]);
  const xmin = Math.min(...xs), xmax = Math.max(...xs);
  const ymin = Math.min(...ys), ymax = Math.max(...ys);

  const details = [];
  if (direction === 'X') {
    for (let y = ymin + cover; y <= ymax - cover + 1e-9; y += spacing) {
      const segs = hlineIntersections(poly, y);
      if (segs.length > 0) {
        const gross = segs.reduce((s, [a, b]) => s + (b - a), 0);
        const net = gross - 2 * cover + 2 * anchor;
        if (net > 0.001) details.push({ pos: y, span: gross, length: net });
      }
    }
  } else {
    for (let x = xmin + cover; x <= xmax - cover + 1e-9; x += spacing) {
      const segs = vlineIntersections(poly, x);
      if (segs.length > 0) {
        const gross = segs.reduce((s, [a, b]) => s + (b - a), 0);
        const net = gross - 2 * cover + 2 * anchor;
        if (net > 0.001) details.push({ pos: x, span: gross, length: net });
      }
    }
  }
  return details;
}

// ==================== 主计算 ====================
function calculate() {
  const errEl = document.getElementById('errorMsg');
  errEl.style.display = 'none';

  // 读取参数
  const cover = parseFloat(document.getElementById('cover').value) / 1000;
  const dia = parseFloat(document.getElementById('rebarDia').value) / 1000;
  const spacing = parseFloat(document.getElementById('rebarSpacing').value) / 1000;
  const anchorFactor = parseFloat(document.getElementById('anchorFactor').value);
  const layers = parseInt(document.getElementById('layers').value);
  const anchor = anchorFactor * dia;
  const density = dia * dia * 1000 * 1000 * 0.00617; // kg/m

  if (cover <= 0 || dia <= 0 || spacing <= 0 || layers < 1) {
    errEl.textContent = '参数错误：请检查各参数是否为正数';
    errEl.style.display = 'block';
    return;
  }

  if (vertices.length < 3) {
    errEl.textContent = '顶点数不足，至少需要 3 个顶点';
    errEl.style.display = 'block';
    return;
  }

  // 计算
  const xDetails = calcDirection(vertices, 'X', cover, anchor, spacing);
  const yDetails = calcDirection(vertices, 'Y', cover, anchor, spacing);

  const xLenPerLayer = xDetails.reduce((s, d) => s + d.length, 0);
  const yLenPerLayer = yDetails.reduce((s, d) => s + d.length, 0);
  const xLenTotal = xLenPerLayer * layers;
  const yLenTotal = yLenPerLayer * layers;
  const grandTotal = xLenTotal + yLenTotal;
  const grandWeight = grandTotal * density;
  const grandCount = (xDetails.length + yDetails.length) * layers;

  // 更新汇总卡片
  document.getElementById('totalCount').textContent = grandCount;
  document.getElementById('totalLength').textContent = grandTotal.toFixed(2);
  document.getElementById('totalWeight').textContent = grandWeight.toFixed(1);

  // 更新分方向表
  const dirBody = document.getElementById('dirTableBody');
  dirBody.innerHTML = `
    <tr>
      <td>X 向（水平）</td>
      <td>${xDetails.length}</td>
      <td>${xLenPerLayer.toFixed(2)} m</td>
      <td>${xLenTotal.toFixed(2)} m</td>
      <td>${(xLenTotal * density).toFixed(1)} kg</td>
    </tr>
    <tr>
      <td>Y 向（竖直）</td>
      <td>${yDetails.length}</td>
      <td>${yLenPerLayer.toFixed(2)} m</td>
      <td>${yLenTotal.toFixed(2)} m</td>
      <td>${(yLenTotal * density).toFixed(1)} kg</td>
    </tr>
    <tr class="total-row">
      <td>合计</td>
      <td>${grandCount}</td>
      <td>${(xLenPerLayer + yLenPerLayer).toFixed(2)} m</td>
      <td>${grandTotal.toFixed(2)} m</td>
      <td>${grandWeight.toFixed(1)} kg</td>
    </tr>
  `;

  // 更新明细表
  document.getElementById('detailPanel').style.display = 'block';
  const xBody = document.getElementById('xDetailBody');
  xBody.innerHTML = xDetails.map((d, i) =>
    `<tr><td>${i + 1}</td><td>${d.pos.toFixed(3)}</td><td>${d.span.toFixed(3)}</td><td>${d.length.toFixed(3)}</td></tr>`
  ).join('');

  const yBody = document.getElementById('yDetailBody');
  yBody.innerHTML = yDetails.map((d, i) =>
    `<tr><td>${i + 1}</td><td>${d.pos.toFixed(3)}</td><td>${d.span.toFixed(3)}</td><td>${d.length.toFixed(3)}</td></tr>`
  ).join('');

  // 绘制 SVG
  drawSVG(vertices, xDetails, yDetails, cover, anchor, spacing);
}

// ==================== SVG 可视化 ====================
function drawSVG(poly, xDetails, yDetails, cover, anchor, spacing) {
  const svg = document.getElementById('rebarSvg');
  const xs = poly.map(p => p[0]);
  const ys = poly.map(p => p[1]);
  const xmin = Math.min(...xs), xmax = Math.max(...xs);
  const ymin = Math.min(...ys), ymax = Math.max(...ys);

  const W = 580, H = 380;
  const pad = 40;
  const scaleX = (W - 2 * pad) / (xmax - xmin || 1);
  const scaleY = (H - 2 * pad) / (ymax - ymin || 1);
  const scale = Math.min(scaleX, scaleY);

  const ox = pad + (W - 2 * pad - (xmax - xmin) * scale) / 2;
  const oy = pad + (H - 2 * pad - (ymax - ymin) * scale) / 2;

  function tx(x) { return ox + (x - xmin) * scale; }
  function ty(y) { return H - oy - (y - ymin) * scale; }

  let html = '';

  // 多边形填充
  const polyStr = poly.map(p => `${tx(p[0])},${ty(p[1])}`).join(' ');
  html += `<polygon points="${polyStr}" fill="rgba(74,144,217,0.08)" stroke="#4a90d9" stroke-width="2"/>`;

  // X 向钢筋（水平线）
  xDetails.forEach(d => {
    const segs = hlineIntersections(poly, d.pos);
    segs.forEach(([a, b]) => {
      html += `<line x1="${tx(a)}" y1="${ty(d.pos)}" x2="${tx(b)}" y2="${ty(d.pos)}" stroke="rgba(255,77,79,0.5)" stroke-width="1"/>`;
    });
  });

  // Y 向钢筋（垂直线）
  yDetails.forEach(d => {
    const segs = vlineIntersections(poly, d.pos);
    segs.forEach(([a, b]) => {
      html += `<line x1="${tx(d.pos)}" y1="${ty(a)}" x2="${tx(d.pos)}" y2="${ty(b)}" stroke="rgba(82,196,26,0.5)" stroke-width="1"/>`;
    });
  });

  // 顶点标注
  poly.forEach((p, i) => {
    html += `<circle cx="${tx(p[0])}" cy="${ty(p[1])}" r="3" fill="#4a90d9"/>`;
    const dx = i % 2 === 0 ? 6 : -18;
    const dy = i % 3 === 0 ? -6 : 12;
    html += `<text x="${tx(p[0]) + dx}" y="${ty(p[1]) + dy}" font-size="10" fill="#666">${i + 1}</text>`;
  });

  // 图例
  html += `<rect x="${W - 150}" y="${H - 50}" width="140" height="40" fill="#fff" stroke="#eee" rx="4"/>`;
  html += `<line x1="${W - 140}" y1="${H - 38}" x2="${W - 110}" y2="${H - 38}" stroke="rgba(255,77,79,0.7)" stroke-width="2"/>`;
  html += `<text x="${W - 105}" y="${H - 34}" font-size="11" fill="#555">X 向钢筋</text>`;
  html += `<line x1="${W - 140}" y1="${H - 20}" x2="${W - 110}" y2="${H - 20}" stroke="rgba(82,196,26,0.7)" stroke-width="2"/>`;
  html += `<text x="${W - 105}" y="${H - 16}" font-size="11" fill="#555">Y 向钢筋</text>`;

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = html;
}

// ==================== 初始化 ====================
renderVertices();
calculate();
</script>
</body>
</html>
