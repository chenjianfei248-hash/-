<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f0f2f5">
<title>多边形基础底板钢筋量计算器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { color-scheme: light; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "Segoe UI", sans-serif;
  background: #f0f2f5; color: #1a1a2e; min-height: 100vh;
  padding: 24px; -webkit-text-size-adjust: 100%;
}
.page-header { max-width: 1200px; margin: 0 auto; }
h1 { text-align: center; font-size: 22px; font-weight: 600; margin-bottom: 6px; }
.subtitle { text-align: center; font-size: 13px; color: #666; margin-bottom: 24px; }
.container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: minmax(320px, 380px) minmax(0, 1fr); gap: 20px; align-items: start; }
.panel, .card { min-width: 0; background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.panel h2 { font-size: 15px; font-weight: 600; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid #eee; color: #333; }
.param-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.param-item label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
.param-item input, .vertex-table input { width: 100%; min-width: 0; min-height: 40px; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font: inherit; font-size: 16px; }
input:focus { outline: none; border-color: #4a90d9; box-shadow: 0 0 0 3px rgba(74,144,217,.12); }
.vertex-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 4px 0 8px; }
.vertex-header span { font-size: 13px; font-weight: 500; color: #444; }
.btn { min-height: 40px; padding: 8px 14px; border: 0; border-radius: 6px; font-size: 13px; cursor: pointer; transition: background .2s; touch-action: manipulation; }
.btn-primary { background: #4a90d9; color: #fff; }
.btn-primary:hover { background: #3a7bc8; }
.btn-sm { min-height: 36px; padding: 6px 10px; font-size: 12px; white-space: nowrap; }
.btn-outline { background: #fff; border: 1px solid #ddd; color: #555; }
.btn-outline:hover { background: #f5f5f5; }
.vertex-table, .dir-table, .detail-table { width: 100%; border-collapse: collapse; }
.vertex-table { margin-bottom: 12px; }
.vertex-table th { font-size: 11px; color: #999; text-align: left; padding: 4px 6px; border-bottom: 1px solid #eee; }
.vertex-table td { padding: 3px 4px; }
.vertex-table input { min-height: 38px; padding: 6px 8px; font-size: 16px; }
.del-btn { width: 36px; height: 36px; border: 0; background: #fff1f0; color: #ff4d4f; border-radius: 6px; cursor: pointer; font-size: 18px; }
.del-btn:hover { background: #ffccc7; }
.calc-btn { width: 100%; min-height: 48px; padding: 12px; font-size: 15px; font-weight: 600; background: #4a90d9; color: #fff; border: 0; border-radius: 8px; cursor: pointer; touch-action: manipulation; }
.calc-btn:hover { background: #3a7bc8; }
.results-area { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.summary-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.card { text-align: center; padding: 16px 10px; }
.card .label { font-size: 12px; color: #888; margin-bottom: 4px; }
.card .value { font-size: clamp(18px, 2.2vw, 22px); font-weight: 700; color: #1a1a2e; overflow-wrap: anywhere; }
.card .unit { font-size: 12px; color: #999; }
.card.highlight { background: linear-gradient(135deg, #4a90d9, #357abd); color: #fff; }
.card.highlight .label { color: rgba(255,255,255,.8); }
.card.highlight .value { color: #fff; }
.card.highlight .unit { color: rgba(255,255,255,.7); }
.table-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.dir-table { min-width: 590px; font-size: 13px; }
.dir-table th { background: #f8f9fa; padding: 8px 10px; text-align: right; font-weight: 500; color: #555; border-bottom: 1px solid #eee; white-space: nowrap; }
.dir-table th:first-child, .dir-table td:first-child { text-align: left; }
.dir-table td { padding: 8px 10px; text-align: right; border-bottom: 1px solid #f5f5f5; white-space: nowrap; }
.dir-table td:first-child { font-weight: 500; }
.dir-table tr:last-child td { border-bottom: none; }
.dir-table .total-row { background: #f0f7ff; font-weight: 600; }
.detail-section h3 { font-size: 13px; color: #555; margin: 12px 0 8px; }
.detail-section h3:first-child { margin-top: 0; }
.detail-table { min-width: 360px; font-size: 12px; }
.detail-table th { position: sticky; top: 0; background: #f8f9fa; padding: 7px 8px; text-align: right; font-weight: 500; color: #666; border-bottom: 1px solid #eee; white-space: nowrap; }
.detail-table th:first-child, .detail-table td:first-child { text-align: left; }
.detail-table td { padding: 6px 8px; text-align: right; border-bottom: 1px solid #f5f5f5; color: #444; white-space: nowrap; }
.detail-table td:first-child { color: #999; }
.svg-container { background: #fafbfc; border: 1px solid #eee; border-radius: 8px; padding: 10px; overflow: hidden; }
.svg-container svg { display: block; width: 100%; height: auto; }
svg text { font-family: -apple-system, "Microsoft YaHei", sans-serif; }
.error-msg { color: #ff4d4f; font-size: 13px; padding: 10px; background: #fff1f0; border-radius: 6px; margin-top: 10px; display: none; }
@media (max-width: 900px) {
  body { padding: 20px; }
  .container { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .results-area { gap: 16px; }
}
@media (max-width: 600px) {
  body { padding: max(12px, env(safe-area-inset-top)) 12px max(16px, env(safe-area-inset-bottom)); }
  h1 { font-size: 19px; line-height: 1.4; }
  .subtitle { font-size: 12px; line-height: 1.5; margin: 4px 4px 16px; }
  .container { gap: 12px; }
  .panel { padding: 15px 13px; border-radius: 9px; }
  .panel h2 { margin-bottom: 12px; }
  .param-grid { gap: 9px; }
  .vertex-header { align-items: flex-start; }
  .vertex-header span { padding-top: 8px; line-height: 1.4; }
  .summary-cards { gap: 8px; }
  .card { padding: 12px 5px; border-radius: 9px; }
  .card .label, .card .unit { font-size: 11px; }
  .card .value { font-size: clamp(16px, 5vw, 20px); }
  .results-area { gap: 12px; }
  .svg-container { padding: 5px; }
}
@media (max-width: 360px) {
  body { padding-left: 9px; padding-right: 9px; }
  .panel { padding-left: 10px; padding-right: 10px; }
  .summary-cards { gap: 5px; }
  .card .value { font-size: 15px; }
  .vertex-header span { font-size: 12px; }
}
</style>
</head>
<body>
<header class="page-header">
  <h1>多边形基础底板钢筋量计算器</h1>
  <p class="subtitle">支持任意正交多边形 · 双层双向配筋 · 射线法逐根计算</p>
</header>
<div class="container">
  <section class="panel" aria-label="输入参数">
    <h2>基础参数</h2>
    <div class="param-grid">
      <div class="param-item"><label for="slabThick">板厚 (mm)</label><input type="number" id="slabThick" value="200" min="100" max="2000"></div>
      <div class="param-item"><label for="rebarDia">钢筋直径 (mm)</label><input type="number" id="rebarDia" value="12" min="6" max="40"></div>
      <div class="param-item"><label for="rebarSpacing">钢筋间距 (mm)</label><input type="number" id="rebarSpacing" value="200" min="100" max="500"></div>
      <div class="param-item"><label for="cover">保护层 (mm)</label><input type="number" id="cover" value="40" min="15" max="80"></div>
      <div class="param-item"><label for="anchorFactor">锚固倍数 (×d)</label><input type="number" id="anchorFactor" value="20" min="0" max="50"></div>
      <div class="param-item"><label for="layers">层数</label><input type="number" id="layers" value="2" min="1" max="4"></div>
    </div>
    <h2>顶点坐标 (m)</h2>
    <div class="vertex-header"><span>按顺序输入，首尾自动闭合</span><button class="btn btn-sm btn-outline" onclick="addVertex()">+ 添加顶点</button></div>
    <table class="vertex-table">
      <thead><tr><th>#</th><th>X</th><th>Y</th><th></th></tr></thead>
      <tbody id="vertexBody"></tbody>
    </table>
    <button class="calc-btn" onclick="calculate()">计 算</button>
    <div class="error-msg" id="errorMsg" role="alert"></div>
  </section>

  <section class="results-area" aria-label="计算结果">
    <div class="summary-cards" id="summaryCards">
      <div class="card"><div class="label">总根数</div><div class="value" id="totalCount">-</div><div class="unit">根</div></div>
      <div class="card"><div class="label">总长度</div><div class="value" id="totalLength">-</div><div class="unit">m</div></div>
      <div class="card highlight"><div class="label">总重量</div><div class="value" id="totalWeight">-</div><div class="unit">kg</div></div>
    </div>
    <section class="panel">
      <h2>分方向汇总</h2>
      <div class="table-scroll"><table class="dir-table" id="dirTable">
        <thead><tr><th>方向</th><th>根数(每层)</th><th>总长(每层)</th><th>总长(全部)</th><th>重量</th></tr></thead>
        <tbody id="dirTableBody"><tr><td colspan="5" style="text-align:center;color:#999;padding:20px;">点击“计算”查看结果</td></tr></tbody>
      </table></div>
    </section>
    <section class="panel">
      <h2>钢筋布置示意</h2>
      <div class="svg-container" id="svgContainer"><svg id="rebarSvg" viewBox="0 0 600 400" role="img" aria-label="钢筋布置示意图"></svg></div>
    </section>
    <section class="panel detail-section" id="detailPanel" style="display:none;">
      <h2>钢筋明细</h2>
      <h3>X 向钢筋明细（水平方向，沿 Y 布置）</h3>
      <div class="table-scroll"><table class="detail-table"><thead><tr><th>#</th><th>Y 位置 (m)</th><th>板宽 (m)</th><th>单根长 (m)</th></tr></thead><tbody id="xDetailBody"></tbody></table></div>
      <h3>Y 向钢筋明细（竖直方向，沿 X 布置）</h3>
      <div class="table-scroll"><table class="detail-table"><thead><tr><th>#</th><th>X 位置 (m)</th><th>板高 (m)</th><th>单根长 (m)</th></tr></thead><tbody id="yDetailBody"></tbody></table></div>
    </section>
  </section>
</div>
<script>
const defaultVertices = [[0,0],[0,7.03],[2.21,7.03],[2.21,9.91],[4.32,9.91],[4.32,8.26],[5.91,8.26],[5.91,5.86],[2.85,5.86],[2.85,0]];
let vertices = defaultVertices.map(v => [...v]);
function renderVertices() {
  const tbody = document.getElementById('vertexBody'); tbody.innerHTML = '';
  vertices.forEach((v, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td style="width:28px;color:#999;font-size:12px;">${i+1}</td><td><input aria-label="顶点 ${i+1} X 坐标" type="number" step="0.01" value="${v[0]}" onchange="updateVertex(${i},0,this.value)"></td><td><input aria-label="顶点 ${i+1} Y 坐标" type="number" step="0.01" value="${v[1]}" onchange="updateVertex(${i},1,this.value)"></td><td><button class="del-btn" onclick="removeVertex(${i})" title="删除顶点 ${i+1}" aria-label="删除顶点 ${i+1}">×</button></td>`;
    tbody.appendChild(tr);
  });
}
function updateVertex(i, axis, val) { vertices[i][axis] = parseFloat(val) || 0; }
function addVertex() { vertices.push([0,0]); renderVertices(); }
function removeVertex(i) { if (vertices.length <= 3) return; vertices.splice(i,1); renderVertices(); }
function hlineIntersections(poly, y) {
  const pts=[], n=poly.length;
  for(let i=0;i<n;i++){const [x1,y1]=poly[i],[x2,y2]=poly[(i+1)%n];if((y1>y)!==(y2>y)){const t=(y-y1)/(y2-y1);pts.push(x1+t*(x2-x1));}}
  pts.sort((a,b)=>a-b); const segs=[]; for(let j=0;j<pts.length-1;j+=2)segs.push([pts[j],pts[j+1]]); return segs;
}
function vlineIntersections(poly, x) {
  const pts=[], n=poly.length;
  for(let i=0;i<n;i++){const [x1,y1]=poly[i],[x2,y2]=poly[(i+1)%n];if((x1>x)!==(x2>x)){const t=(x-x1)/(x2-x1);pts.push(y1+t*(y2-y1));}}
  pts.sort((a,b)=>a-b); const segs=[]; for(let j=0;j<pts.length-1;j+=2)segs.push([pts[j],pts[j+1]]); return segs;
}
function calcDirection(poly,direction,cover,anchor,spacing) {
  const xs=poly.map(p=>p[0]),ys=poly.map(p=>p[1]),xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys),details=[];
  if(direction==='X'){
    for(let y=ymin+cover;y<=ymax-cover+1e-9;y+=spacing){const segs=hlineIntersections(poly,y);if(segs.length){const gross=segs.reduce((s,[a,b])=>s+b-a,0),net=gross-2*cover+2*anchor;if(net>.001)details.push({pos:y,span:gross,length:net});}}
  } else {
    for(let x=xmin+cover;x<=xmax-cover+1e-9;x+=spacing){const segs=vlineIntersections(poly,x);if(segs.length){const gross=segs.reduce((s,[a,b])=>s+b-a,0),net=gross-2*cover+2*anchor;if(net>.001)details.push({pos:x,span:gross,length:net});}}
  }
  return details;
}
function calculate() {
  const errEl=document.getElementById('errorMsg');errEl.style.display='none';
  const cover=parseFloat(document.getElementById('cover').value)/1000,dia=parseFloat(document.getElementById('rebarDia').value)/1000,spacing=parseFloat(document.getElementById('rebarSpacing').value)/1000,anchorFactor=parseFloat(document.getElementById('anchorFactor').value),layers=parseInt(document.getElementById('layers').value),anchor=anchorFactor*dia,density=dia*dia*1000*1000*.00617;
  if(!Number.isFinite(cover)||!Number.isFinite(dia)||!Number.isFinite(spacing)||!Number.isFinite(anchorFactor)||!Number.isFinite(layers)||cover<=0||dia<=0||spacing<=0||anchorFactor<0||layers<1){errEl.textContent='参数错误：请检查各参数';errEl.style.display='block';return;}
  if(vertices.length<3){errEl.textContent='顶点数不足，至少需要 3 个顶点';errEl.style.display='block';return;}
  const xDetails=calcDirection(vertices,'X',cover,anchor,spacing),yDetails=calcDirection(vertices,'Y',cover,anchor,spacing),xLenPerLayer=xDetails.reduce((s,d)=>s+d.length,0),yLenPerLayer=yDetails.reduce((s,d)=>s+d.length,0),xLenTotal=xLenPerLayer*layers,yLenTotal=yLenPerLayer*layers,grandTotal=xLenTotal+yLenTotal,grandWeight=grandTotal*density,grandCount=(xDetails.length+yDetails.length)*layers;
  document.getElementById('totalCount').textContent=grandCount;document.getElementById('totalLength').textContent=grandTotal.toFixed(2);document.getElementById('totalWeight').textContent=grandWeight.toFixed(1);
  document.getElementById('dirTableBody').innerHTML=`<tr><td>X 向（水平）</td><td>${xDetails.length}</td><td>${xLenPerLayer.toFixed(2)} m</td><td>${xLenTotal.toFixed(2)} m</td><td>${(xLenTotal*density).toFixed(1)} kg</td></tr><tr><td>Y 向（竖直）</td><td>${yDetails.length}</td><td>${yLenPerLayer.toFixed(2)} m</td><td>${yLenTotal.toFixed(2)} m</td><td>${(yLenTotal*density).toFixed(1)} kg</td></tr><tr class="total-row"><td>合计</td><td>${grandCount}</td><td>${(xLenPerLayer+yLenPerLayer).toFixed(2)} m</td><td>${grandTotal.toFixed(2)} m</td><td>${grandWeight.toFixed(1)} kg</td></tr>`;
  document.getElementById('detailPanel').style.display='block';
  document.getElementById('xDetailBody').innerHTML=xDetails.map((d,i)=>`<tr><td>${i+1}</td><td>${d.pos.toFixed(3)}</td><td>${d.span.toFixed(3)}</td><td>${d.length.toFixed(3)}</td></tr>`).join('');
  document.getElementById('yDetailBody').innerHTML=yDetails.map((d,i)=>`<tr><td>${i+1}</td><td>${d.pos.toFixed(3)}</td><td>${d.span.toFixed(3)}</td><td>${d.length.toFixed(3)}</td></tr>`).join('');
  drawSVG(vertices,xDetails,yDetails);
}
function drawSVG(poly,xDetails,yDetails) {
  const svg=document.getElementById('rebarSvg'),xs=poly.map(p=>p[0]),ys=poly.map(p=>p[1]),xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys),W=580,H=380,pad=40,scale=Math.min((W-2*pad)/(xmax-xmin||1),(H-2*pad)/(ymax-ymin||1)),ox=pad+(W-2*pad-(xmax-xmin)*scale)/2,oy=pad+(H-2*pad-(ymax-ymin)*scale)/2;
  const tx=x=>ox+(x-xmin)*scale,ty=y=>H-oy-(y-ymin)*scale;let html='';
  html+=`<polygon points="${poly.map(p=>`${tx(p[0])},${ty(p[1])}`).join(' ')}" fill="rgba(74,144,217,0.08)" stroke="#4a90d9" stroke-width="2"/>`;
  xDetails.forEach(d=>hlineIntersections(poly,d.pos).forEach(([a,b])=>html+=`<line x1="${tx(a)}" y1="${ty(d.pos)}" x2="${tx(b)}" y2="${ty(d.pos)}" stroke="rgba(255,77,79,0.5)" stroke-width="1"/>`));
  yDetails.forEach(d=>vlineIntersections(poly,d.pos).forEach(([a,b])=>html+=`<line x1="${tx(d.pos)}" y1="${ty(a)}" x2="${tx(d.pos)}" y2="${ty(b)}" stroke="rgba(82,196,26,0.5)" stroke-width="1"/>`));
  poly.forEach((p,i)=>{html+=`<circle cx="${tx(p[0])}" cy="${ty(p[1])}" r="3" fill="#4a90d9"/><text x="${tx(p[0])+(i%2===0?6:-18)}" y="${ty(p[1])+(i%3===0?-6:12)}" font-size="10" fill="#666">${i+1}</text>`;});
  html+=`<rect x="${W-150}" y="${H-50}" width="140" height="40" fill="#fff" stroke="#eee" rx="4"/><line x1="${W-140}" y1="${H-38}" x2="${W-110}" y2="${H-38}" stroke="rgba(255,77,79,0.7)" stroke-width="2"/><text x="${W-105}" y="${H-34}" font-size="11" fill="#555">X 向钢筋</text><line x1="${W-140}" y1="${H-20}" x2="${W-110}" y2="${H-20}" stroke="rgba(82,196,26,0.7)" stroke-width="2"/><text x="${W-105}" y="${H-16}" font-size="11" fill="#555">Y 向钢筋</text>`;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML=html;
}
renderVertices();calculate();
</script>
</body>
</html>
